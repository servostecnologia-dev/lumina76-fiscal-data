name: Validate Servos product catalog

on:
  push:
    paths: ['produtos/**', 'scripts/build_product_catalog.py', 'tests/test_product_catalog.py', '.github/workflows/validate-products.yml']
  pull_request:
    paths: ['produtos/**', 'scripts/build_product_catalog.py', 'tests/test_product_catalog.py', '.github/workflows/validate-products.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/build_product_catalog.py --check
      - run: python -m unittest discover -s tests -v
