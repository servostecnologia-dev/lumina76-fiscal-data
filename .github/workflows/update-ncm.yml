name: Atualizar catálogo NCM

on:
  workflow_dispatch:
  schedule:
    - cron: "20 6 * * *"

permissions:
  contents: write

jobs:
  update-ncm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Gerar catálogo NCM pela fonte oficial
        run: python scripts/build_ncm_catalog.py

      - name: Validar catálogo gerado
        run: |
          test -s ncm/ncm_atual.csv
          test -s metadata/ncm.json
          python - <<'PY'
          import csv, json
          with open('ncm/ncm_atual.csv', encoding='utf-8', newline='') as f:
              rows = list(csv.DictReader(f, delimiter=';'))
          assert len(rows) >= 10000, len(rows)
          assert all(len(r['codigo']) == 8 and r['codigo'].isdigit() for r in rows)
          meta = json.load(open('metadata/ncm.json', encoding='utf-8'))
          assert meta['source_id'] == 'RFB_CLASSIF_NCM_JSON'
          assert meta['production_ready'] is True
          print('NCMs validados:', len(rows))
          PY

      - name: Commitar somente se houver mudança
        run: |
          git config user.name "lumina76-fiscal-bot"
          git config user.email "lumina76-fiscal-bot@users.noreply.github.com"
          git add ncm metadata/ncm.json
          if git diff --cached --quiet; then
            echo "Nenhuma mudança na tabela NCM."
          else
            git commit -m "Atualiza catálogo NCM oficial"
            git push
          fi
